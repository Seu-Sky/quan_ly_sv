<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sinh viên</title>
    <!-- Nhúng thư viện Bootstrap 5 và FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Nhúng file CSS riêng của bạn -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex">

    <!-- CỘT MENU BÊN TRÁI (SIDEBAR) -->
    <div class="sidebar p-3">
        <h4 class="text-white text-center mb-4 mt-2" style="font-size: 1.2rem;">University Training</h4>
        <ul class="list-unstyled">
            <li class="mb-2">
                <a href="#" class="active"><i class="fas fa-user-friends"></i> Sinh viên</a>
            </li>
            <li class="mb-2">
                <a href="#"><i class="fas fa-book"></i> Học phần</a>
            </li>
            <li class="mb-2">
                <a href="#"><i class="fas fa-building"></i> Phòng học</a>
            </li>
            <li class="mb-2">
                <a href="#"><i class="fas fa-file-invoice-dollar"></i> Học phí</a>
            </li>
        </ul>
    </div>

    <!-- KHU VỰC NỘI DUNG CHÍNH (MAIN CONTENT) -->
    <div class="main-content">
        <!-- Thanh Header -->
        <div class="d-flex justify-content-between align-items-center bg-white p-3 border-bottom shadow-sm">
            <h4 class="m-0 text-dark">Quản lý sinh viên</h4>
            <div class="text-muted" style="font-size: 0.9rem;">
                Home / Sinh viên
            </div>
        </div>

        <!-- Nội dung khung trắng bên dưới -->
        <div class="p-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center py-3">
                    <h5 class="m-0 text-dark"><i class="fas fa-list text-muted me-2"></i> Danh sách sinh viên</h5>
                    <a th:href="@{/students/new}" class="btn btn-primary btn-sm px-3 py-2">
                        <i class="fas fa-plus-circle me-1"></i> Thêm sinh viên
                    </a>
                </div>
                
                <div class="card-body">
                    <!-- Thanh tìm kiếm -->
                    <form class="d-flex mb-4" th:action="@{/students}" method="get" style="max-width: 500px;">
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control form-control-sm me-2" placeholder="Tìm mã SV, họ tên, email...">
                        <button type="submit" class="btn btn-primary btn-sm px-3 text-nowrap">
                            <i class="fas fa-search me-1"></i> Tìm kiếm
                        </button>
                        <a th:href="@{/students}" class="btn btn-light btn-sm ms-2 border" th:if="${keyword != null and keyword != ''}">Xóa</a>
                    </form>

                    <!-- Bảng dữ liệu -->
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle border">
                            <thead>
                                <tr>
                                    <th scope="col" class="text-center">STT</th>
                                    <th scope="col">Mã sinh viên <i class="fas fa-sort text-muted ms-1" style="font-size: 0.8em;"></i></th>
                                    <th scope="col">Họ và tên <i class="fas fa-sort text-muted ms-1" style="font-size: 0.8em;"></i></th>
                                    <th scope="col">Email</th>
                                    <th scope="col">Số điện thoại</th>
                                    <th scope="col">Lớp</th>
                                    <th scope="col" class="text-center">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(students)}">
                                    <td colspan="7" class="text-center text-muted py-4">Không tìm thấy sinh viên nào.</td>
                                </tr>
                                <tr th:each="sv, iterStat : ${students}">
                                    <td class="text-center" th:text="${iterStat.count}"></td>
                                    <td th:text="${sv.mssv}"></td>
                                    <td th:text="${sv.hoTen}"></td>
                                    <td th:text="${sv.email}"></td>
                                    <td th:text="${sv.sdt}"></td>
                                    <td th:text="${sv.lop}"></td>
                                    <td class="text-center">
                                        <a th:href="@{/students/edit/{id}(id=${sv.id})}" class="btn btn-warning btn-sm me-1">
                                            <i class="fas fa-pencil-alt"></i> Sửa
                                        </a>
                                        <a th:href="@{/students/delete/{id}(id=${sv.id})}" class="btn btn-danger btn-sm"
                                           onclick="return confirm('Bạn có chắc muốn xóa sinh viên này?');">
                                            <i class="fas fa-trash-alt"></i> Xóa
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
